# Infer-only run config for mixed_5task_fastwam_joint.
# Aligned with FastWAM-infer-in-DexJoco `fastwam-joint-infer-eval`:
#   create_fastwam_joint, mot_checkpoint_mixed_attn=false, num_video_frames=9.
# Do not load these weights with vanilla create_fastwam.

eval_num_inference_steps: 10
mixed_precision: bf16

model:
  _target_: fastwam.runtime.create_fastwam_joint
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
  tokenizer_max_len: 128
  load_text_encoder: false
  load_vae: true
  proprio_dim: 23
  redirect_common_files: true
  mot_checkpoint_mixed_attn: false
  action_dit_pretrained_path: null
  skip_dit_load_from_pretrain: true
  video_dit_config:
    has_image_input: false
    patch_size: [1, 2, 2]
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-06
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: false
    video_attention_mask_mode: first_frame_causal
    action_conditioned: false
    action_dim: 22
    action_group_causal_mask_mode: group_diagonal
  action_dit_config:
    action_dim: 22
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    use_gradient_checkpointing: false
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  loss:
    lambda_action: 1.0

data:
  train:
    num_frames: 33
    video_size: [224, 448]
    concat_multi_camera: horizontal
    context_len: 128
    shape_meta:
      images:
        - key: front
          raw_shape: [3, 640, 640]
          shape: [3, 224, 224]
        - key: wrist
          raw_shape: [3, 640, 640]
          shape: [3, 224, 224]
      action:
        - key: default
          raw_shape: 22
          shape: 22
      state:
        - key: default
          raw_shape: 23
          shape: 23
    processor:
      _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta: ${data.train.shape_meta}
      num_obs_steps: 33
      num_output_cameras: 2
      action_output_dim: 22
      proprio_output_dim: 23
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: z-score
      norm_exception_mode: null
      norm_stats_source: pretrained
      norm_stats_meta_dir: null
      action_state_merger:
        _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms: null
      val_transforms: null

num_video_frames: 9

EVALUATION:
  seed: 20260812
  text_cfg_scale: 0.0
  rand_device: cpu
  tiled: false
  num_video_frames: 9
  image_resize: area
